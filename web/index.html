<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evidence First · 证据优先问答</title>
<style>
:root{font-family:system-ui,sans-serif;color:#1d2935;background:#f5f4ef}*{box-sizing:border-box}body{max-width:1160px;margin:auto;padding:36px 24px}header{border-bottom:1px solid #d5d8d2;padding-bottom:22px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:750;letter-spacing:.08em}.tag{font-size:12px;background:#e2eee8;color:#245d48;padding:8px 12px;border-radius:20px}h1{font-size:42px;letter-spacing:-.04em;margin-bottom:12px}p{line-height:1.7;color:#5b6870}main{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;margin-top:30px}.panel{background:white;border:1px solid #dddeda;border-radius:14px;padding:24px}label{display:block;font-size:14px;font-weight:600;margin-bottom:10px}textarea{width:100%;min-height:120px;resize:vertical;border:1px solid #c5cdc8;border-radius:8px;padding:14px;font:inherit}select,button{font:inherit;padding:10px 14px;border-radius:7px;border:1px solid #c5cdc8;background:white}button{cursor:pointer}button.primary{background:#235a46;color:white;border:0}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:15px}.small{font-size:12px;color:#65726b}.answer{white-space:pre-wrap;line-height:1.9;margin-top:18px;font-size:15px}article{border-top:1px solid #e4e7e3;margin-top:16px;padding-top:12px}article p{font-size:14px}h2{font-size:19px;margin-top:0}.metric{font-size:12px;color:#52705f;margin-top:14px}footer{margin-top:28px;font-size:12px;color:#69756d}@media(max-width:760px){main{grid-template-columns:1fr}h1{font-size:30px}body{padding:22px 16px}}
</style>
<header><span class="brand">EVIDENCE / FIRST</span><span class="tag">本地实验室 · v0.1</span></header>
<h1>每一个回答，都有据可查。</h1>
<p>从检索到证据，观察一次回答如何产生。使用原创虚构的 Atlas 产品手册演示。</p>
<main><section class="panel"><label for="question">你想了解什么？</label><textarea id="question" maxlength="2000">任务因网络错误失败会重试几次？</textarea>
<div class="row"><select id="mode" aria-label="检索方式"><option value="bm25">关键词 · BM25</option value="dense" disabled>语义检索 · 需本地模型</option><option value="hybrid" disabled>混合检索 · 需本地模型</option></select><button id="submit" class="primary">查找证据</button></div>
<div class="row"><label class="small"><input id="generate" type="checkbox" disabled> 使用本地模型生成回答</label></div>
<div class="row"><button class="example" data-q="实验结果支持哪些导出格式？">结果导出</button><button class="example" data-q="火星直径是多少？">试试无答案问题</button></div>
<p id="setup" class="small">正在读取配置…</p><div id="status" role="status" class="metric"></div><div id="answer" class="answer" aria-live="polite">输入问题后，原文摘录和引用将出现在这里。</div></section>
<aside class="panel"><h2>检索证据</h2><p class="small">分数用于排序，不代表答案正确概率。被拒答的问题也会保留候选证据供检查。</p><div id="evidence"></div></aside></main>
<footer>演示数据不含真实业务资料。离线模式只返回原文摘录；生成模式仅校验引用编号，尚不能保证每句话都被证据支持。</footer>
<script>
const $=id=>document.getElementById(id);
fetch('/api/status').then(r=>r.json()).then(s=>{for(const o of $('mode').options)if(o.value!=='bm25')o.disabled=!s.embedding;$('generate').disabled=!s.generation;$('setup').textContent=`${s.chunks} 条演示资料 · ${s.embedding?'已配置语义检索':'关键词模式可直接使用'} · ${s.generation?'已配置生成模型':'当前为原文摘录模式'}`}).catch(()=>{$('setup').textContent='无法连接本地服务'});
document.querySelectorAll('.example').forEach(b=>b.onclick=()=>{$('question').value=b.dataset.q});
$('submit').onclick=async()=>{const button=$('submit');button.disabled=true;$('status').textContent='正在查找证据…';$('answer').textContent='';$('evidence').replaceChildren();try{const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('question').value,mode:$('mode').value,generate:$('generate').checked})});const d=await r.json();if(!r.ok)throw new Error(d.error);$('answer').textContent=d.answer;const labels={evidence:'原文摘录',abstained:'证据不足',citation_rejected:'引用校验未通过',generated_unverified:'模型回答 · 语义支持待核验'};$('status').textContent=`${labels[d.status]} · ${d.total_ms} ms · 词项覆盖率 ${Math.round(d.overlap*100)}%`;for(const c of d.evidence){const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),s=document.createElement('div');h.textContent=`[${c.id}] ${c.title}`;p.textContent=c.text;s.className='small';s.textContent=`${c.source} · 排序分数 ${c.score.toFixed(4)}`;a.append(h,p,s);$('evidence').append(a)}}catch(e){$('status').textContent='请求失败';$('answer').textContent=e.message}finally{button.disabled=false}};
</script></html>
