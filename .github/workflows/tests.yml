name: Python checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python evaluate.py --output reports/ci-smoke.json
      - run: python evaluate.py --corpus data/python_docs/corpus.json --questions data/python_docs/questions.json --dataset-name python-docs-zh-v0.1 --split dev --output reports/ci-python-dev.json
